name: build-desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller
      - name: Build (PyInstaller)
        run: uv run pyinstaller JenaonBot.spec
      # Artifact storage quota can block uploads for hours; the release
      # asset below is the reliable delivery path.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: JenaonBot-macos
          path: dist/JenaonBot.app
      - name: Package app bundle
        run: ditto -c -k --keepParent dist/JenaonBot.app dist/JenaonBot-macos.zip
      - name: Upload to latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest-build --prerelease --title "Latest build" --notes "Automated build" || true
          gh release upload latest-build dist/JenaonBot-macos.zip --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller
      - name: Build (PyInstaller)
        run: uv run pyinstaller --windowed --onefile --name JenaonBot src/main_app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: JenaonBot-windows
          path: dist/JenaonBot.exe
      - name: Upload to latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create latest-build --prerelease --title "Latest build" --notes "Automated build" || true
          gh release upload latest-build dist/JenaonBot.exe --clobber
