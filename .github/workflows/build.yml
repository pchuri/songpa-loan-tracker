name: build-desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Generate version info
        shell: bash
        env:
          UPDATER_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.UPDATER_TOKEN || '' }}
        run: |
          SHA="${{ github.sha }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          printf 'APP_VERSION = "%s"\nBUILD_SHA = "%s"\nBUILD_TIME = "%s"\n' "$VERSION" "$SHA" "$NOW" > src/_version.py
          printf '{"version":"%s","sha":"%s","time":"%s"}\n' "$VERSION" "$SHA" "$NOW" > version.json
          if [ -n "$UPDATER_TOKEN" ]; then
            printf 'GITHUB_TOKEN = "%s"\n' "$UPDATER_TOKEN" > src/_updater_token.py
          fi
      - name: Build (PyInstaller)
        run: uv run pyinstaller songpa-loan-tracker.spec
      # Artifact storage quota can block uploads for hours; the release
      # asset below is the reliable delivery path.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: songpa-loan-tracker-macos
          path: dist/songpa-loan-tracker.app
      - name: Package app bundle
        run: ditto -c -k --keepParent dist/songpa-loan-tracker.app dist/songpa-loan-tracker-macos.zip
      - name: Upload to latest-build release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest-build --prerelease --title "Latest build" --notes "Automated build" || true
          gh release upload latest-build dist/songpa-loan-tracker-macos.zip --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Generate version info
        shell: bash
        env:
          UPDATER_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.UPDATER_TOKEN || '' }}
        run: |
          SHA="${{ github.sha }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          printf 'APP_VERSION = "%s"\nBUILD_SHA = "%s"\nBUILD_TIME = "%s"\n' "$VERSION" "$SHA" "$NOW" > src/_version.py
          printf '{"version":"%s","sha":"%s","time":"%s"}\n' "$VERSION" "$SHA" "$NOW" > version.json
          if [ -n "$UPDATER_TOKEN" ]; then
            printf 'GITHUB_TOKEN = "%s"\n' "$UPDATER_TOKEN" > src/_updater_token.py
          fi
      - name: Build (PyInstaller)
        run: uv run pyinstaller --windowed --onefile --name songpa-loan-tracker --icon resources/songpa-loan-tracker.ico src/main_app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: songpa-loan-tracker-windows
          path: dist/songpa-loan-tracker.exe
      - name: Upload to latest-build release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create latest-build --prerelease --title "Latest build" --notes "Automated build" || true
          gh release upload latest-build dist/songpa-loan-tracker.exe version.json --clobber
