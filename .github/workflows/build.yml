name: build-desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PySide6 6.10.1 has no Python 3.15 wheel. Keep desktop builds on the
# tested interpreter even when uv's default Python advances.
env:
  UV_PYTHON: "3.12"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked pytest
      - name: Generate version info
        shell: bash
        env:
          UPDATER_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.UPDATER_TOKEN || '' }}
        run: |
          SHA="${{ github.sha }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          printf 'APP_VERSION = "%s"\nBUILD_SHA = "%s"\nBUILD_TIME = "%s"\n' "$VERSION" "$SHA" "$NOW" > src/_version.py
          printf '{"version":"%s","sha":"%s","time":"%s"}\n' "$VERSION" "$SHA" "$NOW" > version.json
          if [ -n "$UPDATER_TOKEN" ]; then
            printf 'GITHUB_TOKEN = "%s"\n' "$UPDATER_TOKEN" > src/_updater_token.py
          fi
      - name: Build (PyInstaller)
        run: uv run pyinstaller songpa-loan-tracker.spec
      - name: Package and verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/songpa-loan-tracker.app"
          ARCHIVE="dist/songpa-loan-tracker-macos.zip"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          ditto -x -k "$ARCHIVE" "$VERIFY_DIR"
          uv run --locked python scripts/verify_macos_bundle.py "$APP" "$VERIFY_DIR/songpa-loan-tracker.app"
          codesign --verify --deep --strict --verbose=2 "$VERIFY_DIR/songpa-loan-tracker.app"
          codesign --display --verbose=4 "$VERIFY_DIR/songpa-loan-tracker.app"
          (cd dist && shasum -a 256 songpa-loan-tracker-macos.zip > songpa-loan-tracker-macos.zip.sha256)
          cp version.json dist/songpa-loan-tracker-macos-build.json
      # Upload the verified ZIP, never the raw .app: artifact storage otherwise
      # flattens framework symlinks and loses executable permission bits.
      # Both uploads are required before the coordinator can publish either platform.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songpa-loan-tracker-macos
          retention-days: 7
          path: |
            dist/songpa-loan-tracker-macos.zip
            dist/songpa-loan-tracker-macos.zip.sha256
            dist/songpa-loan-tracker-macos-build.json
          if-no-files-found: error
          compression-level: 0

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked pytest
      - name: Generate version info
        shell: bash
        env:
          UPDATER_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.UPDATER_TOKEN || '' }}
        run: |
          SHA="${{ github.sha }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          printf 'APP_VERSION = "%s"\nBUILD_SHA = "%s"\nBUILD_TIME = "%s"\n' "$VERSION" "$SHA" "$NOW" > src/_version.py
          printf '{"version":"%s","sha":"%s","time":"%s"}\n' "$VERSION" "$SHA" "$NOW" > version.json
          if [ -n "$UPDATER_TOKEN" ]; then
            printf 'GITHUB_TOKEN = "%s"\n' "$UPDATER_TOKEN" > src/_updater_token.py
          fi
      - name: Build (PyInstaller)
        run: uv run pyinstaller --windowed --onefile --name songpa-loan-tracker --icon resources/songpa-loan-tracker.ico src/main_app.py
      - name: Prepare Windows release metadata
        shell: bash
        run: cp version.json dist/version.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songpa-loan-tracker-windows
          retention-days: 7
          path: |
            dist/songpa-loan-tracker.exe
            dist/version.json
          if-no-files-found: error

  verify-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: songpa-loan-tracker-*
          path: release-input
          merge-multiple: true
      - name: Verify complete release inputs without publishing
        run: python3 scripts/publish_release.py release-input --sha "$GITHUB_SHA"

  publish-release:
    needs: [verify-release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: songpa-latest-build-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: songpa-loan-tracker-*
          path: release-input
          merge-multiple: true
      - name: Publish a complete coherent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py release-input --sha "$GITHUB_SHA" --publish
