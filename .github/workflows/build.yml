name: build-desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked pytest
      - name: Generate version info
        shell: bash
        env:
          UPDATER_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.UPDATER_TOKEN || '' }}
        run: |
          SHA="${{ github.sha }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          printf 'APP_VERSION = "%s"\nBUILD_SHA = "%s"\nBUILD_TIME = "%s"\n' "$VERSION" "$SHA" "$NOW" > src/_version.py
          printf '{"version":"%s","sha":"%s","time":"%s"}\n' "$VERSION" "$SHA" "$NOW" > version.json
          if [ -n "$UPDATER_TOKEN" ]; then
            printf 'GITHUB_TOKEN = "%s"\n' "$UPDATER_TOKEN" > src/_updater_token.py
          fi
      - name: Build (PyInstaller)
        run: uv run pyinstaller songpa-loan-tracker.spec
      - name: Package and verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/songpa-loan-tracker.app"
          ARCHIVE="dist/songpa-loan-tracker-macos.zip"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          ditto -x -k "$ARCHIVE" "$VERIFY_DIR"
          uv run --locked python scripts/verify_macos_bundle.py "$APP" "$VERIFY_DIR/songpa-loan-tracker.app"
          codesign --verify --deep --strict --verbose=2 "$VERIFY_DIR/songpa-loan-tracker.app"
          codesign --display --verbose=4 "$VERIFY_DIR/songpa-loan-tracker.app"
          (cd dist && shasum -a 256 songpa-loan-tracker-macos.zip > songpa-loan-tracker-macos.zip.sha256)
          cp version.json dist/songpa-loan-tracker-macos-build.json
      # Upload the verified ZIP, never the raw .app: artifact storage otherwise
      # flattens framework symlinks and loses executable permission bits.
      # PRs have no release fallback, so artifact upload must succeed there.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        with:
          name: songpa-loan-tracker-macos
          retention-days: 7
          path: |
            dist/songpa-loan-tracker-macos.zip
            dist/songpa-loan-tracker-macos.zip.sha256
            dist/songpa-loan-tracker-macos-build.json
          if-no-files-found: error
          compression-level: 0
      - name: Upload to latest-build release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest-build --prerelease --title "Latest build" --notes "Automated build" || true
          gh release upload latest-build dist/songpa-loan-tracker-macos.zip --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked pytest
      - name: Generate version info
        shell: bash
        env:
          UPDATER_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.UPDATER_TOKEN || '' }}
        run: |
          SHA="${{ github.sha }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          printf 'APP_VERSION = "%s"\nBUILD_SHA = "%s"\nBUILD_TIME = "%s"\n' "$VERSION" "$SHA" "$NOW" > src/_version.py
          printf '{"version":"%s","sha":"%s","time":"%s"}\n' "$VERSION" "$SHA" "$NOW" > version.json
          if [ -n "$UPDATER_TOKEN" ]; then
            printf 'GITHUB_TOKEN = "%s"\n' "$UPDATER_TOKEN" > src/_updater_token.py
          fi
      - name: Build (PyInstaller)
        run: uv run pyinstaller --windowed --onefile --name songpa-loan-tracker --icon resources/songpa-loan-tracker.ico src/main_app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: songpa-loan-tracker-windows
          retention-days: 7
          path: dist/songpa-loan-tracker.exe
      - name: Upload to latest-build release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create latest-build --prerelease --title "Latest build" --notes "Automated build" || true
          gh release upload latest-build dist/songpa-loan-tracker.exe version.json --clobber
