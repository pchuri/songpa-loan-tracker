[project]
name = "jenaonbot-desktop"
version = "0.1.0"
description = "PySide6 desktop client for JenaonBot"
readme = "README.md"
requires-python = ">=3.9,<3.15"
dependencies = [
    "PySide6==6.10.1",
    "aiohttp==3.10.10",
    "beautifulsoup4",
    "cryptography>=42.0.0",
    "keyring>=24.0.0",
    "python-dotenv>=1.0.1",
    "qasync==0.27.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
